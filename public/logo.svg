<svg viewBox="0 0 200 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logo-grad" x1="100" y1="10" x2="100" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF4D55" />
      <stop offset="45%" stop-color="#D31A24" />
      <stop offset="100%" stop-color="#9E0B12" />
    </linearGradient>
    <linearGradient id="logo-blade" x1="100" y1="20" x2="100" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF4D55" />
      <stop offset="50%" stop-color="#D31A24" />
      <stop offset="100%" stop-color="#9E0B12" />
    </linearGradient>
  </defs>

  <!-- FLAME BODY -->
  <path
    d="M 100 8
       C 104 22, 106 38, 112 50
       C 118 62, 128 72, 134 60
       C 132 78, 126 94, 118 108
       C 114 114, 122 120, 128 126
       C 138 136, 146 150, 148 166
       C 152 186, 142 208, 124 222
       C 112 230, 98 232, 92 230
       C 82 226, 72 218, 66 206
       C 58 190, 58 170, 62 152
       C 66 136, 76 122, 80 114
       C 74 100, 68 84, 66 66
       C 72 76, 82 66, 88 52
       C 94 38, 96 22, 100 8 Z
       
       M 100 58
       C 95 72, 88 92, 86 114
       C 84 136, 86 156, 92 174
       C 96 186, 100 196, 100 206
       C 100 196, 104 186, 108 174
       C 114 156, 116 136, 114 114
       C 112 92, 105 72, 100 58 Z"
    fill="url(#logo-grad)"
    fill-rule="evenodd"
  />

  <!-- CENTRAL DAGGER BLADE (Upper Tip) -->
  <path
    d="M 100 22 L 108 55 L 92 55 Z"
    fill="url(#logo-blade)"
  />

  <!-- CENTRAL DAGGER BLADE (Lower Wedge) -->
  <path
    d="M 94 112 L 106 112 L 114 168 L 86 168 Z"
    fill="url(#logo-blade)"
  />

  <!-- DAGGER CROSS-GUARD BAR -->
  <path
    d="M 80 168 L 120 168 L 124 180 L 76 180 Z"
    fill="url(#logo-grad)"
    stroke="#FF4D55"
    stroke-width="1.5"
    stroke-linejoin="round"
  />

  <!-- DAGGER HILT HANDLE -->
  <path
    d="M 94 180 L 106 180 L 106 208 L 94 208 Z"
    fill="url(#logo-grad)"
    stroke="#FF4D55"
    stroke-width="1.5"
  />

  <!-- HILT GRIP RINGS -->
  <line x1="94" y1="189" x2="106" y2="189" stroke="#FF4D55" stroke-width="1.5" />
  <line x1="94" y1="198" x2="106" y2="198" stroke="#FF4D55" stroke-width="1.5" />

  <!-- DAGGER POMMEL -->
  <path
    d="M 91 208 C 91 208, 93 222, 100 222 C 107 222, 109 208, 109 208 Z"
    fill="url(#logo-grad)"
    stroke="#FF4D55"
    stroke-width="1.5"
  />
</svg>
